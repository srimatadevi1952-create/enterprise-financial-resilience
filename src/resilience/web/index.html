<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Enterprise Resilience Console · Canvas Edition</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#171715}body{font-family:"Arial Narrow",Arial,sans-serif}.master{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;pointer-events:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:transparent}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.status{position:fixed;left:50%;bottom:12px;transform:translate(-50%,150%);padding:10px 16px;background:#1d1c19;color:#f3efe6;border:1px solid #ed4b15;letter-spacing:.12em;text-transform:uppercase;font-size:12px;transition:.25s;pointer-events:none}.status.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<img id="master" class="master" src="/web-assets/m22-console-canvas-master-v2.png" alt="">
<canvas id="console" role="application" tabindex="0" aria-label="Enterprise Financial Resilience operating console. Press S for Simulation Lab, L for Live Monitor, numbers 1 through 6 for parameter decks, and R to run a private scenario."></canvas>
<div class="sr-only" aria-live="polite" id="announcer"></div><div class="status" id="status"></div>
<script>
const DESIGN={w:1881,h:1073};
const CONTROLS=['Capital','Liquidity','Operations','Regulation','Merchants','Countries & Corridors'];
const canvas=document.getElementById('console'),ctx=canvas.getContext('2d'),master=document.getElementById('master'),announcer=document.getElementById('announcer'),statusEl=document.getElementById('status');
const app={scale:1,ox:0,oy:0,dpr:1,mode:'live',bootstrap:null,session:null,state:null,variables:{},overlay:null,panel:null,drag:null};
const api=(path,options={})=>fetch(path,{...options,headers:{'Content-Type':'application/json','X-EFR-Principal':'analyst',...(options.headers||{})}}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data});
function announce(message){announcer.textContent=message;statusEl.textContent=message;statusEl.classList.add('show');clearTimeout(announce.timer);announce.timer=setTimeout(()=>statusEl.classList.remove('show'),2400)}
function fit(){app.dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*app.dpr);canvas.height=Math.round(innerHeight*app.dpr);app.scale=Math.min(innerWidth/DESIGN.w,innerHeight/DESIGN.h);app.ox=(innerWidth-DESIGN.w*app.scale)/2;app.oy=(innerHeight-DESIGN.h*app.scale)/2;draw()}
function paper(alpha=.97){ctx.fillStyle=`rgba(241,238,231,${alpha})`;ctx.strokeStyle='#24231f'}
function setFont(size,weight='400',family='Arial Narrow, Arial'){ctx.font=`${weight} ${size}px ${family}`;ctx.textBaseline='middle'}
function draw(){if(!master.complete||!master.naturalWidth)return;ctx.setTransform(app.dpr,0,0,app.dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(app.ox,app.oy);ctx.scale(app.scale,app.scale);if(app.mode==='simulation')drawSimulationLayer();if(app.panel)drawPanel();if(app.overlay==='authorize')drawAuthorization();if(app.overlay==='share')drawShare();ctx.restore()}
function drawSimulationLayer(){paper(.94);ctx.fillRect(686,34,354,49);ctx.strokeRect(686,34,354,49);ctx.fillStyle='#24231f';setFont(16,'700');ctx.fillText('LIVE MONITOR · CONTINUES',712,59);paper(.98);ctx.fillRect(1093,34,425,49);ctx.strokeStyle='#ed4b15';ctx.lineWidth=3;ctx.strokeRect(1093,34,425,49);ctx.fillStyle='#ed4b15';ctx.beginPath();ctx.arc(1120,58,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24231f';setFont(18,'700');ctx.fillText('SIMULATION LAB',1142,59);setFont(10,'400');ctx.fillText('PRIVATE · NO LIVE ACTION',1325,59);paper(.97);ctx.fillRect(1541,34,285,49);ctx.strokeStyle='#24231f';ctx.lineWidth=1;ctx.strokeRect(1541,34,285,49);setFont(14,'700');ctx.fillText('SHARE CONSOLE',1580,59);if(app.state&&app.state.probability*app.state.impact>=3)drawDynamicRisk()}
function riskColour(state){const severity=state.probability*state.impact;return severity<3?'#4c4b47':severity<18?'#f4c542':severity<45?'#f29a23':'#ed4b15'}
function drawDynamicRisk(){const s=app.state,colour=riskColour(s);ctx.save();ctx.globalCompositeOperation='color';ctx.globalAlpha=.72;ctx.fillStyle=colour;ctx.beginPath();ctx.arc(941,460,134,0,Math.PI*2);ctx.fill();ctx.restore();paper(.96);ctx.fillRect(1358,642,288,132);ctx.fillStyle=colour;setFont(122,'700','Georgia');ctx.fillText(String(s.resilience).padStart(2,'0'),1362,710);ctx.fillStyle='#24231f';setFont(34,'400');ctx.fillText('/100',1555,737);const px=177+Math.min(2,s.probability/5)*72,py=690-Math.min(2,s.impact/5)*74;ctx.fillStyle=colour;ctx.strokeStyle='#24231f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();ctx.stroke();const active=s.payment_disruption!=='stable';if(active){ctx.fillStyle=colour;[[1476,279],[1476,312],[1476,344],[1476,377],[1677,279],[1677,312],[1677,344],[1677,377]].forEach(([x,y])=>ctx.fillRect(x-8,y-8,16,16))}}
function drawPanel(){const p=app.panel;paper();ctx.lineWidth=2;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#24231f';ctx.fillRect(p.x,p.y,p.w,64);ctx.fillStyle='#f3efe6';setFont(18,'700');ctx.fillText(`${String(p.index+1).padStart(2,'0')}  ${p.control.toUpperCase()} PARAMETER DECK`,p.x+24,p.y+32);setFont(12,'400');ctx.fillText(`${(app.variables[p.control]||[]).length} VARIABLES · ${app.mode==='live'?'READ ONLY':'PRIVATE DRAFT'}`,p.x+24,p.y+51);setFont(28,'400');ctx.fillText('×',p.x+p.w-38,p.y+31);const level=app.state.controls[p.control];ctx.fillStyle='#24231f';setFont(13,'700');ctx.fillText('CONTROL LEVEL',p.x+28,p.y+94);ctx.fillText(String(level),p.x+p.w-55,p.y+94);const tx=p.x+28,tw=p.w-56,ty=p.y+120;ctx.strokeStyle='#8d877c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+tw,ty);ctx.stroke();ctx.strokeStyle='#ed4b15';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+tw*level/100,ty);ctx.stroke();ctx.fillStyle='#24231f';ctx.fillRect(tx+tw*level/100-7,ty-12,14,24);const vars=(app.variables[p.control]||[]).slice(0,10);vars.forEach((v,i)=>{const y=p.y+166+i*39;ctx.strokeStyle='#b5afa5';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x+28,y+18);ctx.lineTo(p.x+p.w-28,y+18);ctx.stroke();ctx.fillStyle='#24231f';setFont(13,i===0?'700':'400');ctx.fillText(v.variable,p.x+28,y);ctx.fillStyle='#716d65';setFont(10,'400');ctx.textAlign='right';ctx.fillText(`${v.variable_type} · ${v.typical_unit}`,p.x+p.w-28,y);ctx.textAlign='left'});ctx.fillStyle='#716d65';setFont(11,'400');ctx.fillText(app.mode==='live'?'INSPECT ONLY · ENTER SIMULATION LAB TO MANIPULATE':'DRAG TITLE BAR · ADJUST LEVEL · RUN SCENARIO',p.x+28,p.y+p.h-24)}
function drawAuthorization(){ctx.fillStyle='rgba(15,14,12,.55)';ctx.fillRect(0,0,DESIGN.w,DESIGN.h);const x=543,y=268,w=795,h=520;paper();ctx.lineWidth=2;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.fillStyle='#24231f';setFont(22,'700');ctx.fillText('SIMULATION AUTHORIZATION',x+38,y+52);ctx.fillStyle='#ed4b15';ctx.fillRect(x+38,y+82,120,4);ctx.fillStyle='#24231f';setFont(15,'400');ctx.fillText('A private workspace will be created from the current timestamped enterprise state.',x+38,y+125);ctx.fillText('Live monitoring and every other user’s dashboard continue unchanged.',x+38,y+151);[['IDENTITY VERIFIED','Asha Iyer · local development identity'],['SIMULATION ENTITLED','Scope simulation:create verified'],['ISOLATION BOUNDARY','No live actions · private snapshot']].forEach((r,i)=>{const ry=y+205+i*67;ctx.strokeStyle='#938d83';ctx.strokeRect(x+38,ry,w-76,48);ctx.fillStyle='#24231f';setFont(13,'700');ctx.fillText('✓  '+r[0],x+56,ry+17);ctx.fillStyle='#716d65';setFont(11);ctx.fillText(r[1],x+56,ry+35)});ctx.fillStyle='#24231f';ctx.fillRect(x+38,y+h-72,220,42);ctx.fillStyle='#f3efe6';setFont(13,'700');ctx.fillText('CANCEL',x+112,y+h-51);ctx.fillStyle='#ed4b15';ctx.fillRect(x+w-310,y+h-72,272,42);ctx.fillStyle='#fff';ctx.fillText('ENTER SIMULATION LAB',x+w-276,y+h-51)}
function drawShare(){ctx.fillStyle='rgba(15,14,12,.55)';ctx.fillRect(0,0,DESIGN.w,DESIGN.h);const x=548,y=290,w=785,h=455;paper();ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.fillStyle='#24231f';setFont(22,'700');ctx.fillText('SHARE PRIVATE SIMULATION',x+38,y+52);setFont(14);ctx.fillText('Communication and screen presentation',x+38,y+105);ctx.strokeRect(x+38,y+130,330,82);setFont(16,'700');ctx.fillText('PRESENT WITH MEET / ZOOM',x+58,y+162);setFont(11);ctx.fillText('Screen only · no console permission',x+58,y+188);setFont(14);ctx.fillText('Authenticated application participation',x+38,y+258);ctx.strokeRect(x+38,y+282,330,82);setFont(16,'700');ctx.fillText('INVITE VIEWER-1',x+58,y+315);setFont(11);ctx.fillText('Viewer role · session scoped',x+58,y+340);ctx.strokeRect(x+417,y+130,330,82);setFont(16,'700');ctx.fillText('COPY SECURE SESSION LINK',x+437,y+162);setFont(11);ctx.fillText('Expiring link · authentication required',x+437,y+188);ctx.fillStyle='#24231f';ctx.fillRect(x+w-176,y+h-58,138,34);ctx.fillStyle='#f3efe6';setFont(12,'700');ctx.fillText('CLOSE',x+w-130,y+h-41)}
function point(event){return{x:(event.clientX-app.ox)/app.scale,y:(event.clientY-app.oy)/app.scale}}
function inside(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}
const zones={live:{x:686,y:32,w:360,h:54},simulation:{x:1090,y:32,w:430,h:54},share:{x:1538,y:30,w:292,h:60},run:{x:1576,y:793,w:154,h:190}};
const controlZones=CONTROLS.map((name,i)=>({name,x:49+i*198,y:793,w:188,h:197}));
async function authorize(){try{app.session=await api('/api/simulation-sessions',{method:'POST',body:JSON.stringify({step_up_verified:true,purpose:'Enterprise stress and recovery analysis'})});app.state=app.session.state;app.mode='simulation';app.overlay=null;announce('Private Simulation Lab created · live state unchanged');draw()}catch(e){announce(e.message)}}
async function run(){if(app.mode!=='simulation'){app.overlay='authorize';draw();return}try{const data=await api(`/api/simulation-sessions/${app.session.session_id}/run`,{method:'POST',body:JSON.stringify({controls:app.state.controls})});app.state=data.state;announce('Scenario complete · live state unchanged');draw()}catch(e){announce(e.message)}}
async function invite(){try{const result=await api(`/api/simulation-sessions/${app.session.session_id}/invite`,{method:'POST',body:JSON.stringify({actor_id:'viewer-1',role:'viewer'})});announce(`${result.actor_id} invited as ${result.role}`)}catch(e){announce(e.message)}}
function openPanel(index){app.panel={index,control:CONTROLS[index],x:570,y:178,w:740,h:640};draw()}
canvas.addEventListener('pointerdown',async e=>{const p=point(e);if(p.x<0||p.y<0||p.x>DESIGN.w||p.y>DESIGN.h)return;if(app.overlay==='authorize'){if(inside(p,{x:1028,y:716,w:272,h:42}))await authorize();else if(inside(p,{x:581,y:716,w:220,h:42})){app.overlay=null;draw()}return}if(app.overlay==='share'){if(inside(p,{x:586,y:572,w:330,h:82}))await invite();else if(inside(p,{x:965,y:420,w:330,h:82})){await navigator.clipboard.writeText(location.origin+'/?session='+app.session.session_id);announce('Secure session link copied')}else if(inside(p,{x:1170,y:687,w:138,h:34})){app.overlay=null;draw()}else if(inside(p,{x:586,y:420,w:330,h:82}))announce('Start screen sharing in Meet or Zoom');return}if(app.panel){const q=app.panel;if(inside(p,{x:q.x+q.w-60,y:q.y,w:60,h:64})){app.panel=null;draw();return}if(inside(p,{x:q.x,y:q.y,w:q.w,h:64})){app.drag={dx:p.x-q.x,dy:p.y-q.y};canvas.setPointerCapture(e.pointerId);return}if(inside(p,{x:q.x+28,y:q.y+98,w:q.w-56,h:45})&&app.mode==='simulation'){const value=Math.round(Math.max(0,Math.min(1,(p.x-(q.x+28))/(q.w-56)))*100);app.state.controls[q.control]=value;draw();return}}if(inside(p,zones.live)){app.mode='live';app.state=structuredClone(app.bootstrap.live);app.panel=null;announce('Live Monitor · read only');draw();return}if(inside(p,zones.simulation)){if(app.session){app.mode='simulation';app.state=app.session.state;draw()}else{app.overlay='authorize';draw()}return}if(inside(p,zones.share)){if(app.mode==='simulation')app.overlay='share';else app.overlay='authorize';draw();return}if(inside(p,zones.run)){await run();return}const i=controlZones.findIndex(z=>inside(p,z));if(i>=0)openPanel(i)});
canvas.addEventListener('pointermove',e=>{const p=point(e);if(app.drag&&app.panel){app.panel.x=Math.max(0,Math.min(DESIGN.w-app.panel.w,p.x-app.drag.dx));app.panel.y=Math.max(0,Math.min(DESIGN.h-app.panel.h,p.y-app.drag.dy));draw();return}const active=[zones.live,zones.simulation,zones.share,zones.run,...controlZones].some(z=>inside(p,z))||app.panel;canvas.style.cursor=active?'pointer':'default'});
canvas.addEventListener('pointerup',()=>app.drag=null);canvas.addEventListener('pointercancel',()=>app.drag=null);
addEventListener('keydown',e=>{if(e.key==='Escape'){app.overlay=null;app.panel=null;draw()}else if(e.key.toLowerCase()==='l'){app.mode='live';app.state=structuredClone(app.bootstrap.live);draw()}else if(e.key.toLowerCase()==='s'){app.session?app.mode='simulation':app.overlay='authorize';draw()}else if(e.key.toLowerCase()==='r')run();else if(/^[1-6]$/.test(e.key))openPanel(+e.key-1)});
addEventListener('resize',fit);master.onload=async()=>{fit();try{app.bootstrap=await api('/api/bootstrap');app.state=structuredClone(app.bootstrap.live);app.variables=app.bootstrap.variables;draw();announce('Live Monitor ready · read only')}catch(e){announce(e.message)}};
</script>
</body>
</html>
