<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Enterprise Resilience Console · UAT Remediation</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#171715}body{font-family:"Arial Narrow",Arial,sans-serif}.master{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;pointer-events:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:transparent}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.status{position:fixed;left:50%;bottom:12px;transform:translate(-50%,150%);padding:10px 16px;background:#1d1c19;color:#f3efe6;border:1px solid #ed4b15;letter-spacing:.12em;text-transform:uppercase;font-size:12px;transition:.25s;pointer-events:none}.status.show{transform:translate(-50%,0)}.signout{position:fixed;right:14px;top:12px;z-index:3;border:1px solid #24231f;background:rgba(238,234,224,.9);color:#24231f;padding:6px 10px;font:700 10px "Arial Narrow",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.signout:hover{background:#ed4b15;color:white}
</style>
</head>
<body>
<img id="master" class="master" src="/web-assets/m22-console-canvas-master-v2.png" alt="">
<canvas id="console" role="application" tabindex="0" aria-label="Enterprise Financial Resilience operating console. Press S for Simulation Lab, L for Live Monitor, A for Operational Assurance, numbers 1 through 6 for expert parameter decks, and R to calculate a private scenario."></canvas>
<div class="sr-only" aria-live="polite" id="announcer"></div>
<div class="sr-only" id="assurance-description"></div>
<div class="status" id="status"></div>
<button class="signout" id="signout" type="button">Sign out</button>

</body>
</html>
