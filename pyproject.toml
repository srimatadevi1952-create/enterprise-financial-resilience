[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-financial-resilience"
version = "0.0.1"
description = "M0 isolated financial resilience development foundation"
requires-python = "==3.12.*"
dependencies = ["psycopg[binary]==3.3.6", "pydantic==2.13.5", "SQLAlchemy==2.0.54", "alembic==1.20.0"]

[project.scripts]
resilience = "resilience.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resilience = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the isolated local V2 databases"]
